    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special For You ✨</title>
    <style>
        :root { --primary: #5fa8d3; --text: #334756; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #d4eaf7 0%, #ffffff 100%);
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden; padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.9); padding: 2.5rem;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%; max-width: 380px; text-align: center; z-index: 10;
            backdrop-filter: blur(10px);
        }
        h1 { color: var(--primary); font-size: 1.6rem; }
        input {
            width: 90%; padding: 12px; border: 1px solid #c9d6df;
            border-radius: 12px; margin-bottom: 20px; text-align: center;
        }
        .btn {
            background: var(--primary); color: white; border: none;
            padding: 10px 18px; border-radius: 12px; cursor: pointer;
            font-weight: 600; margin: 5px; transition: 0.3s; font-size: 0.85rem;
        }
        .btn:hover { transform: translateY(-2px); background: #4a90b5; }
        .hidden { display: none; }
        .message-box {
            background: white; padding: 20px; margin-top: 20px;
            line-height: 1.6; border-radius: 15px; border: 1px solid #eef2f3;
            min-height: 80px; display: flex; flex-direction: column; justify-content: center;
        }
        .signature { margin-top: 15px; font-weight: bold; color: var(--primary); font-style: italic; font-size: 0.85rem; }
        .emoji { position: fixed; top: -10%; z-index: 1; animation: fall linear forwards; pointer-events: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-betterdays.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div id="step-name">
        <h1>Halo.. 👋</h1>
        <p>Boleh tau namamu?</p>
        <input type="text" id="input-nama" placeholder="Tulis namamu...">
        <br>
        <button class="btn" onclick="start()">Buka ✨</button>
    </div>

    <div id="step-final" class="hidden">
        <h1>Hai, <span id="user-name"></span>! 😊</h1>
        <div class="btn-group">
            <button class="btn" onclick="msg(1)">Semangat</button>
            <button class="btn" onclick="msg(2)">Istirahat</button>
            <button class="btn" onclick="msg(3)">Ingat Ini</button>
        </div>
        <div class="message-box">
            <div id="txt">Klik tombol di atas..</div>
            <div class="signature">~ Dari Alisa yang baik hati</div>
        </div>
    </div>
</div>

<script>
    function start() {
        const n = document.getElementById('input-nama').value;
        if (n.trim() !== "") {
            document.getElementById('step-name').classList.add('hidden');
            document.getElementById('step-final').classList.remove('hidden');
            document.getElementById('user-name').innerText = n;
            const a = document.getElementById('bgMusic'); a.volume = 0.4; a.play();
            setInterval(() => {
                const e = document.createElement('div'); e.classList.add('emoji');
                e.innerHTML = ['✨', '☁️', '🌙', '⭐'][Math.floor(Math.random() * 4)];
                e.style.left = Math.random() * 100 + "vw";
                e.style.animationDuration = Math.random() * 3 + 3 + "s";
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 5000);
            }, 500);
        } else { alert("Isi nama dulu ya!"); }
    }
    function msg(t) {
        const m = document.getElementById('txt');
        if(t===1) m.innerText = "Apapun harinya, kamu hebat sudah bertahan. Semangat terus ya!";
        if(t===2) m.innerText = "Jangan lupa istirahat. Kamu berharga, jangan terlalu capek ya.";
        if(t===3) m.innerText = "Ingat, kamu nggak sendirian. Selalu ada hal baik yang nunggu kamu!";
    }
</script>
</body>
</html>
