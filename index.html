   <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesuatu Untukmu ✨</title>
    <style>
        :root {
            --primary-blue: #5fa8d3;
            --bg-blue: #f0f7fa;
            --text-dark: #334756;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #d4eaf7 0%, #ffffff 100%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        h1 { color: var(--primary-blue); font-size: 1.6rem; margin-bottom: 20px; }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            border: 1px solid #c9d6df;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
            font-size: 1rem;
            text-align: center;
            background: #fdfdfd;
        }

        .btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .btn:hover { background: #4a90b5; transform: translateY(-2px); }

        .hidden { display: none; }

        .message-box {
            background: white;
            padding: 20px;
            margin-top: 20px;
            line-height: 1.6;
            font-size: 1rem;
            border-radius: 15px;
            border: 1px solid #eef2f3;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            flex-direction: column;
        }

        .signature {
            margin-top: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--primary-blue);
            font-style: italic;
        }

        .emoji {
            position: fixed;
            top: -10%;
            z-index: 1;
            animation: fall linear forwards;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
