<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ✨</title>
    <style>
        :root {
            --primary-blue: #3a86ff;
            --bg-blue: #ebf2ff;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #a2c2e8 0%, #ffffff 100%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            z-index: 10;
        }

        h1 { color: var(--primary-blue); font-size: 1.5rem; }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            border: 1.5px solid #d1d8e0;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            font-size: 1rem;
            text-align: center;
        }

        .btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn:hover { background: #2a6edb; transform: scale(1.05); }

        .hidden { display: none; }

        .message-box {
            background: #f8faff;
            padding: 18px;
            margin-top: 15px;
            line-height: 1.6;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid #e1e8f0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji {
            position: fixed;
            top: -10%;
            z-index: 1;
            animation: fall linear forwards;
            user-select: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div id="step-name">
        <h1>Halo! 👋</h1>
        <p>Boleh tau nama kamu?</p>
        <input type="text" id="input-nama" placeholder="Ketik di sini...">
        <br>
        <button class="btn" onclick="showContent()">Yuk Masuk ✨</button>
    </div>

    <div id="step-final" class="hidden">
        <h1>Semangat, <span id="user-name"></span>! 😊</h1>
        <p>Klik tombol di bawah untuk pesanmu:</p>
        
        <div class="btn-group">
            <button class="btn" onclick="changeMsg(1)">Capek ya?</button>
            <button class="btn" onclick="changeMsg(2)">Butuh Moodbooster?</button>
            <button class="btn" onclick="changeMsg(3)">Tentang Hari Ini</button>
            <button class="btn" onclick="changeMsg(4)">Self Reward</button>
        </div>

        <div id="display-msg" class="message-box">
            Klik salah satu tombol di atas ya!
        </div>

        <p style="margin-top: 20px; font-size: 0.8rem; color: #636e72;">Musik pengiring sedang diputar... 🎵</p>
    </div>
</div>

<script>
    function showContent() {
        const nama = document.getElementById('input-nama').value;
        if (nama.trim() !== "") {
            document.getElementById('step-name').classList.add('hidden');
            document.getElementById('step-final').classList.remove('hidden');
            document.getElementById('user-name').innerText = nama;
            
            // Putar Musik
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Audio play prevented by browser"));
            
            startEmojiRain();
        } else {
            alert("Isi nama kamu dulu ya!");
        }
    }

    function changeMsg(type) {
        const box = document.getElementById('display-msg');
        if(type === 1) box.innerText = "Istirahat sebentar ya. Dunia nggak akan lari kok kalau kamu rehat sejenak. Kamu sudah hebat!";
        if(type === 2) box.innerText = "Ingat ya, ada orang yang selalu bersyukur karena kenal sama kamu. Keep smiling!";
        if(type === 3) box.innerText = "Apapun yang terjadi hari ini, anggap itu pelajaran. Besok pasti ada hal baik yang nunggu kamu.";
        if(type === 4) box.innerText = "Jangan lupa jajan makanan enak hari ini! Kamu layak dapet apresiasi buat kerja kerasmu.";
    }

    function startEmojiRain() {
        const emojis = ['✨', '☁️', '☀️', '⭐', '🌊', '🦾', '🌈', '🍭'];
        setInterval(() => {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji');
            emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + "vw";
            emoji.style.fontSize = Math.random() * 20 + 15 + "px";
            emoji.style.animationDuration = Math.random() * 2 + 3 + "s";
            emoji.style.opacity = Math.random();
            document.body.appendChild(emoji);
            setTimeout(() => { emoji.remove(); }, 5000);
        }, 400);
    }
</script>

</body>
</html>
